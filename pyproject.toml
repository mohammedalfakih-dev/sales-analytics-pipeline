[project]
name = "sales-analytics-pipeline"
version = "0.1.0"
description = "Reproducible pandas sales cleaning and business reporting"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas==2.2.3",
    "matplotlib==3.10.0",
    "pyarrow==18.1.0",
]

[project.optional-dependencies]
azure = ["azure-identity==1.19.0", "azure-storage-blob==12.24.0"]

[dependency-groups]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
